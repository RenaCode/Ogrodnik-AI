replicaCount: 1

# Ile starych ReplicaSetow trzymac po rolloucie. Domyslne k8s to 10, co przy
# deployu z kazdego pusha uzbieralo 115 pustych RS w ~2.5 miesiaca.
revisionHistoryLimit: 3

image:
  # WLASCICIEL PAKIETU TO `renacode`, NIE `mbeczynski`.
  #
  # Repozytorium przeszlo na organizacje RenaCode, a docker-publish.yml sklada
  # adres z `IMAGE_OWNER: ${{ github.repository_owner }}` - wiec od tamtej pory
  # obrazy ida do ghcr.io/renacode/ogrodnik-ai, a nie pod adres ponizej.
  #
  # To wlasnie stad wzial sie commit ec03452 "rollback image to sha-bedbf19
  # (sha-e5afc34 missing from GHCR)". sha-e5afc34 NIE BYLO brakujace w GHCR -
  # lezalo (i lezy) pod adresem `renacode`. Brakowalo go wylacznie pod starym
  # adresem `mbeczynski`, w ktory patrzyl ten chart. Rollback leczyl objaw.
  #
  # Stan rejestru sprawdzony 2026-09-11 anonimowo:
  #   ghcr.io/renacode/ogrodnik-ai   -> latest, sha-e5afc34, sha-37f6826
  #   ghcr.io/mbeczynski/ogrodnik-ai -> zamrozone, ostatni sha-bedbf19
  # Obecnosc sha-37f6826 potwierdzona osobno przez API rejestru (HTTP 200).
  repository: ghcr.io/renacode/ogrodnik-ai
  tag: "sha-0ac609a"
  pullPolicy: IfNotPresent

# Sidecar sqlite-web: przeglądarka bazy bez żadnego uwierzytelniania, z
# zamontowanym PVC. W klastrze nasłuchiwałby na porcie poda dostępnym dla
# każdego innego poda - czyli dawałby odczyt i ZAPIS tabeli appsetting (token
# Home Assistanta, klucze Gemini/Hydrawise) z pominięciem logowania. Domyślnie
# wyłączony; włączaj tylko doraźnie i najlepiej razem z NetworkPolicy.
dbWeb:
  enabled: false
  image:
    repository: coleifer/sqlite-web
    # coleifer/sqlite-web publikuje wyłącznie tag "latest" (brak tagów wersji),
    # więc jedyny sposób na przypięcie konkretnego obrazu to digest. Poniższy
    # odpowiada "latest" z 2025-03-02.
    digest: "sha256:1e5b86237968ed747554f951c6df2fc2fe4bf4ef070b8ca23d553d7f6c6426f7"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: ogrodnik.renacode.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ogrodnik-tls-cert
      hosts:
        - ogrodnik.renacode.com

  # NAGLOWKI BEZPIECZENSTWA (templates/middleware.yaml).
  #
  # Sprawdzone na produkcji 2026-09-12: ogrodnik.renacode.com odpowiadal BEZ
  # ktoregokolwiek z nich. Statyczna wizytowka renacode.com ma je od 2026-09-11;
  # panel administracyjny z tokenem Home Assistanta - nie mial.
  securityHeaders:
    enabled: true

    hsts:
      seconds: 31536000        # 1 rok
      # Wylaczone z tego samego powodu co w renacode-website: includeSubDomains
      # z JEDNEJ poddomeny nie obejmuje rodzenstwa, ale wlaczanie go tutaj bez
      # przegladu calej domeny nie ma sensu, a odwolanie trwa tyle, ile seconds.
      includeSubdomains: false
      preload: false

    # Panel ma formularze zmieniajace stan (ustawienia, usuwanie roslin,
    # sterowanie kosiarka), a ciasteczko sesji jest SameSite=Lax - frameDeny
    # zamyka droge przez nakladke w obcej ramce.
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin

    # CSP ODPOWIADA TEMU, CO STRONY FAKTYCZNIE LADUJA - sprawdzone w szablonach:
    #   * cdn.tailwindcss.com (base.html, login.html) -> musi byc w script-src,
    #     a poniewaz Tailwind Play wstrzykuje style w locie, takze w style-src,
    #   * cdn.jsdelivr.net (chart.js, przypiety + integrity) -> script-src,
    #   * dashboard.html i garden.html maja bloki <script> w tresci -> na razie
    #     'unsafe-inline'; ich wyniesienie do app/static/ pozwoli to skreslic,
    #   * kroje z /static, zdjecia z /photos i /maps -> 'self'.
    #
    # TO JEST POLITYKA PRZEJSCIOWA, nie docelowa. 'unsafe-inline' w script-src
    # sprawia, ze CSP nie powstrzyma wstrzyknietego skryptu - jej wartosc tutaj
    # to form-action, frame-ancestors i base-uri. Zamkniecie tego wymaga
    # zbudowania Tailwinda do pliku i wyniesienia skryptow inline.
    contentSecurityPolicy: >-
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      font-src 'self';
      connect-src 'self';
      object-src 'none';
      frame-ancestors 'none';
      base-uri 'none';
      form-action 'self'

persistence:
  size: 2Gi
  storageClass: local-path

secretName: ogrodnik-secret

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
