{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ogrodnik.fullname" . }}
  labels:
    {{- include "ogrodnik.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.ingress.securityHeaders.enabled }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.securityHeaders.enabled }}
    # Podpiecie Middleware'u z naglowkami bezpieczenstwa (templates/middleware.yaml).
    # Nazwa MUSI miec postac <namespace>-<nazwa zasobu>@kubernetescrd - stad
    # skladanie jej tutaj, a nie wpisanie na sztywno w values.yaml.
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "ogrodnik.fullname" . }}-security-headers@kubernetescrd
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "ogrodnik.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
