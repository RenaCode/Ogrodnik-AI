apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ogrodnik.fullname" . }}
  labels:
    {{- include "ogrodnik.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      {{- include "ogrodnik.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ogrodnik.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: ogrodnik-ai
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

        {{- if .Values.dbWeb.enabled }}
        # UWAGA: sqlite-web nie ma logowania, a nasłuchuje na porcie poda -
        # każdy inny pod w klastrze może przez niego czytać ORAZ nadpisywać
        # tabelę appsetting (tokeny HA/Gemini/Hydrawise), omijając logowanie do
        # aplikacji. W docker-compose.yml ten port jest przypięty do 127.0.0.1;
        # tutaj takiej ochrony nie ma, więc domyślnie sidecar jest wyłączony.
        # Włączaj tylko doraźnie do debugowania i najlepiej razem z
        # NetworkPolicy ograniczającą dostęp do portu 8080.
        - name: ogrodnik-db
          image: "{{ .Values.dbWeb.image.repository }}@{{ .Values.dbWeb.image.digest }}"
          imagePullPolicy: {{ .Values.dbWeb.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: SQLITE_DATABASE
              value: "ogrodnik.db"
          volumeMounts:
            - name: data-volume
              mountPath: /data
          resources:
            {{- toYaml .Values.dbWeb.resources | nindent 12 }}
        {{- end }}

      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "ogrodnik.fullname" . }}-data-pvc
