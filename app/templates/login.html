<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ t("Zaloguj się") }} - Ogrodnik AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preload" href="/static/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /*
      KROJE Z WLASNEGO SERWERA, NIE Z GOOGLE FONTS.
      Do 2026-09-12 stal tu znacznik <link> z arkuszem z Google Fonts, wraz
      z dwoma preconnect do serwerow Google (googleapis / gstatic). Skutek:
      kazde wyswietlenie EKRANU LOGOWANIA do panelu administracyjnego wysylalo
      adres IP i User-Agent odwiedzajacego do Google, zanim ktokolwiek cokolwiek
      kliknal. Sprawdzone na produkcji: GET https://ogrodnik.renacode.com/login
      zwracal te znaczniki anonimowo.

      Pliki to te same woff2, ktore renacode-website juz serwuje z wlasnego
      obrazu. Zadeklarowany zakres wag 600-800 odpowiada temu, co jest w pliku
      (ten sam plik i ta sama deklaracja co na stronie glownej); lzejsze wagi
      uzyte nizej przez klasy Tailwinda przegladarka przytnie do 600.
    */
    @font-face {
      font-family: 'Outfit';
      font-style: normal;
      font-weight: 600 800;
      font-display: swap;
      src: url('/static/fonts/outfit-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Outfit';
      font-style: normal;
      font-weight: 600 800;
      font-display: swap;
      src: url('/static/fonts/outfit-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    body {
      font-family: 'Outfit', sans-serif;
    }
    .glass {
      background: rgba(16, 44, 27, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-emerald-950 to-teal-950 text-slate-100 flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 mb-6 text-3xl shadow-lg shadow-emerald-950/50">
      🌱
    </div>
    <h2 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">Ogrodnik AI</h2>
    <p class="mt-2 text-sm text-emerald-400/80 font-light">{{ t("Zaloguj się do panelu zarządzania ogrodem") }}</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="glass py-8 px-6 shadow-2xl rounded-2xl sm:px-10">
      {% if error %}
      <div class="mb-6 rounded-lg bg-red-500/10 border border-red-500/20 p-4 text-sm text-red-400 flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 flex-shrink-0">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
        </svg>
        <span>{{ t(error) }}</span>
      </div>
      {% endif %}

      <form class="space-y-6" action="/login" method="POST">
        <div>
          <label for="username" class="block text-xs font-semibold text-emerald-400 uppercase tracking-wider">{{ t("Nazwa użytkownika") }}</label>
          <div class="mt-2">
            <input id="username" name="username" type="text" autocomplete="username" required class="block w-full rounded-xl border-0 py-3 px-4 bg-emerald-950/30 text-white placeholder-emerald-700/50 ring-1 ring-inset ring-white/10 focus:ring-2 focus:ring-inset focus:ring-emerald-500 focus:bg-emerald-950/50 sm:text-sm sm:leading-6 transition-all duration-200 outline-none" placeholder="admin">
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-emerald-400 uppercase tracking-wider">{{ t("Hasło") }}</label>
          <div class="mt-2">
            <input id="password" name="password" type="password" autocomplete="current-password" required class="block w-full rounded-xl border-0 py-3 px-4 bg-emerald-950/30 text-white placeholder-emerald-700/50 ring-1 ring-inset ring-white/10 focus:ring-2 focus:ring-inset focus:ring-emerald-500 focus:bg-emerald-950/50 sm:text-sm sm:leading-6 transition-all duration-200 outline-none" placeholder="••••••••">
          </div>
        </div>

        <div>
          <button type="submit" class="flex w-full justify-center rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 py-3 px-4 text-sm font-semibold text-white shadow-lg hover:from-emerald-400 hover:to-teal-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500 active:scale-[0.98] transition-all duration-200">
            {{ t("Zaloguj się") }}
          </button>
        </div>
      </form>
    </div>

    <div class="mt-6 text-center text-xs text-emerald-500/40">
      {{ t("Mój ogród") }} &copy; 2026. {{ t("Zabezpieczono przez Ogrodnik AI.") }}
    </div>
  </div>
</body>
</html>
